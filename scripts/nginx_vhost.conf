# =============================================================================
# VIRTUAL HOST NGINX - AAPANEL DEBIAN 13
# Domínio: votacao.comara.intraer
# Raiz: /www/wwwroot/votacao.comara.intraer/public
# =============================================================================

server {
    listen 80;
    server_name votacao.comara.intraer;
    index index.php index.html;
    root /www/wwwroot/votacao.comara.intraer/public;

    # Limite para uploads manuais de fotos
    client_max_body_size 25M;

    # Ocultar cabeçalhos de versão por segurança
    server_tokens off;

    # Cabeçalhos de Proteção HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloqueio de arquivos ocultos e sensíveis
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Bloqueio de acesso a pastas internas caso o root esteja incorreto
    location ~ ^/(config|database|src|views|scripts|backups|cache)/ {
        deny all;
        return 404;
    }

    # Roteamento Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processamento PHP 8.3 FPM no aaPanel
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 180;
        fastcgi_read_timeout 180;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # Cache de arquivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    access_log /www/wwwlogs/votacao.comara.intraer.log;
    error_log /www/wwwlogs/votacao.comara.intraer.error.log;
}
